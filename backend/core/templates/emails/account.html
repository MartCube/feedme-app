<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td style="font-size:15px;font-weight:700;letter-spacing:-0.01em;color:#0d9488;padding-bottom:24px;">FeedMe</td>
            </tr>
            <tr>
              <td style="font-size:22px;font-weight:700;line-height:1.3;padding-bottom:12px;">{{ heading }}</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;color:#52525b;padding-bottom:28px;">{{ body }}</td>
            </tr>
            <tr>
              <td>
                <a href="{{ url }}" style="display:inline-block;background:#0d9488;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 22px;border-radius:12px;">{{ button }}</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:12px;line-height:1.6;color:#a1a1aa;padding-top:28px;word-break:break-all;">If the button doesn't work, open this link:<br>{{ url }}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
