# Tooling config for the backend. Not a package — the app runs from manage.py.

[tool.ruff]
line-length = 100
target-version = 'py313'
# Generated by Django's migration writer; formatting them fights makemigrations.
extend-exclude = ['**/migrations/**']

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'UP', 'B', 'DJ']

[tool.ruff.lint.per-file-ignores]
# Verbatim feed markup copied from what the real sources serve. Rewrapping it to fit a
# Python line-length rule would make the fixtures less faithful than the thing they mimic.
'tests/feeds.py' = ['E501']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'feedme.settings'
testpaths = ['tests']
python_files = 'test_*.py'
