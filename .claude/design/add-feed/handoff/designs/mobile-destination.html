<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destination, one source</title>
<!-- FeedMe add-feed handoff mockup. Ink theme values; see ../HANDOFF.md § 5 for the token mapping. Yellow .ann notes are annotations, not UI. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#121213}
*{box-sizing:border-box}
.ph{--bg:#1F1F21;--el:#252527;--mu:#303032;--tx:#F2F2F2;--tm:#9A9A9E;--td:#6E6E72;--bd:rgba(255,255,255,.07);--pr:#2DD4BF;--er:#F87171;--sh:0 0 0 1px #252527,0 6px 20px rgba(0,0,0,.35)}
.ph{width:390px;height:844px;background:var(--bg);color:var(--tx);font-family:Sora,sans-serif;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:12px 32px 0;border-radius:24px 24px 0 0}
.lip{width:36px;height:4px;border-radius:2px;background:var(--mu);align-self:center;flex:none}
.top{display:flex;align-items:center;gap:8px;margin-top:16px;flex:none}
.ib{width:48px;height:48px;border-radius:999px;background:var(--el);box-shadow:var(--sh);border:0;color:var(--tm);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.t1{font-size:24px;font-weight:600;line-height:1.25;margin:0}
.t3{font-size:16px;line-height:1.6;margin:0}
.t4{font-size:12px;line-height:1.4;margin:0}
.m{color:var(--tm)}.p{color:var(--pr)}
.card{background:var(--el);border-radius:16px;padding:16px;border:0;width:100%;font:inherit;color:inherit;text-align:left}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
.ann{position:absolute;font-size:12px;line-height:1.4;color:#1F1F21;background:#FDE68A;border-radius:8px;padding:4px 8px;font-family:Sora,sans-serif;max-width:220px}
</style>
</head>
<body>
<div class="ph">
  <div class="lip"></div>
  <div class="top">
    <button class="ib" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <button class="ib" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  </div>
  <h1 class="t1" style="margin-top:32px">Add Veritasium to</h1>
  <div class="col" style="gap:16px;margin-top:24px">
    <button class="card row"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span class="t3 p">New feed</span></button>
    <button class="card row" style="gap:8px"><span class="t3">Skiing</span><span class="t4 m">2</span></button>
    <button class="card row" style="gap:8px"><span class="t3">Extraction check</span><span class="t4 m">3</span></button>
    <button class="card row" style="gap:8px"><span class="t3">Vue</span><span class="t4 m">5</span></button>
    <button class="card row" style="gap:8px"><span class="t3">Hacker News: Front Page</span><span class="t4 m">1</span></button>
  </div>
  <div class="ann" style="left:150px;top:150px">Replaces the ‘Adding’ list + ‘Add to’ label. The name wraps if long.</div>
  <div class="ann" style="left:24px;top:560px">Rows, commit, refusals and New feed → Name step: all unchanged from today.</div>
</div>
</body>
</html>
