services:
  api:
    build: ./backend
    restart: unless-stopped
    healthcheck:
      # /health is the one endpoint opted out of the bearer guard, precisely so this
      # works. urllib rather than curl: python:3.13-slim ships no curl.
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health")',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    environment:
      POSTGRES_HOST: db
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedme
      POSTGRES_USER: feedme
      POSTGRES_PASSWORD: feedme
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedme']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
