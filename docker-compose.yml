# api, worker and scheduler are one image with three different commands — the shared bits
# live here so they can't drift apart.
x-backend: &backend
  build: ./backend
  image: feedme-backend
  restart: unless-stopped
  volumes:
    - ./backend:/app
  environment:
    POSTGRES_HOST: db
  env_file:
    - path: .env
      required: false

services:
  api:
    <<: *backend
    healthcheck:
      # /health is the one endpoint opted out of the bearer guard, precisely so this
      # works. urllib rather than curl: python:3.13-slim ships no curl.
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health")',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs the actors in core/tasks.py. `entrypoint: []` drops entrypoint.sh's migrate +
  # ensure_superuser bootstrap — only api should run migrations, and waiting on its
  # healthcheck is what guarantees they already have.
  worker:
    <<: *backend
    entrypoint: []
    # Both numbers pinned deliberately. The default is one process per CPU x 8 threads,
    # which would open more Postgres connections than its default max_connections allows —
    # to poll three sources twice an hour.
    command: ['dramatiq', 'core.tasks', '--processes', '2', '--threads', '4']
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  # periodiq only enqueues the sweep; the worker executes it. -v to make each wake-up
  # visible in `docker compose logs scheduler`.
  scheduler:
    <<: *backend
    entrypoint: []
    command: ['periodiq', '-v', 'core.tasks']
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedme
      POSTGRES_USER: feedme
      POSTGRES_PASSWORD: feedme
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedme']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
