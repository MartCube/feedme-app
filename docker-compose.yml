# The two ends of the image signature, written once and handed to both: Django stamps every
# image path with an HMAC of it, imgproxy refuses a path whose stamp doesn't match, so nobody
# can point our resizer at their own images. The fallbacks are dev values, not secrets —
# production sets both through .env (docs/images.md § Operations).
x-imgproxy-secret: &imgproxy-secret
  IMGPROXY_KEY: ${IMGPROXY_KEY:-4c6787d69a0eabca6a551dc54df3d45c2f6230bfd6767cf00ccfa2584aed956d}
  IMGPROXY_SALT: ${IMGPROXY_SALT:-12229850b010d088efab8693437c0a66045956f88875b4d70a1cda319387379c}

# api, worker and scheduler are one image with three different commands — the shared bits
# live here so they can't drift apart.
x-backend: &backend
  build: ./backend
  image: feedme-backend
  restart: unless-stopped
  volumes:
    - ./backend:/app
  environment:
    <<: *imgproxy-secret
    POSTGRES_HOST: db
    # where the *browser* reaches imgproxy — a phone on the LAN needs the host's LAN address
    # here, exactly as it does for NUXT_PUBLIC_API_BASE
    IMGPROXY_PUBLIC_URL: ${IMGPROXY_PUBLIC_URL:-http://localhost:8080}
  env_file:
    - path: .env
      required: false

services:
  api:
    <<: *backend
    healthcheck:
      # /health is the one endpoint opted out of the bearer guard, precisely so this
      # works. urllib rather than curl: python:3.13-slim ships no curl.
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health")',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs the actors in core/tasks.py. `entrypoint: []` drops entrypoint.sh's migrate +
  # ensure_superuser bootstrap — only api should run migrations, and waiting on its
  # healthcheck is what guarantees they already have.
  worker:
    <<: *backend
    entrypoint: []
    # Both numbers pinned deliberately. The default is one process per CPU x 8 threads,
    # which would open more Postgres connections than its default max_connections allows —
    # to poll three sources twice an hour.
    command: ['dramatiq', 'core.tasks', '--processes', '2', '--threads', '4']
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  # periodiq only enqueues the sweep; the worker executes it. -v to make each wake-up
  # visible in `docker compose logs scheduler`.
  scheduler:
    <<: *backend
    entrypoint: []
    command: ['periodiq', '-v', 'core.tasks']
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedme
      POSTGRES_USER: feedme
      POSTGRES_PASSWORD: feedme
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedme']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  # Resizes and crops on demand and stores nothing — stage 1 of docs/images.md. Private,
  # loopback and link-local source addresses are refused by default: the SSRF rule
  # core/fetch.py had to write by hand, here for free.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.31.0
    restart: unless-stopped
    environment:
      <<: *imgproxy-secret
      IMGPROXY_MAX_SRC_FILE_SIZE: 10485760 # 10 MB
      IMGPROXY_DOWNLOAD_TIMEOUT: 10
      IMGPROXY_TTL: 31536000 # a year, explicit: a signed URL is stable, so caches should hold
    ports:
      - '8080:8080'

volumes:
  pgdata:
